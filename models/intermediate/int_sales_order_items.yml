version: 2

models:
  - name: int_sales_order_items
    description: >
      Sales order lines enriched with order header attributes and revenue metrics.
      One row per sales order line.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_sales_sales_order_detail')
      - dbt_utils.expression_is_true:
          arguments:
            expression: "net_amount = gross_amount - discount_amount"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "discount_amount <= gross_amount"
    columns:
      - name: sales_order_detail_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: sales_order_id
        data_tests:
          - not_null
      - name: order_status_name
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['In process', 'Approved', 'Backordered', 'Rejected', 'Shipped', 'Cancelled']
      - name: order_quantity
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: gross_amount
        description: order_quantity * unit_price.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: discount_amount
        description: order_quantity * unit_price * unit_price_discount_pct.
      - name: net_amount
        description: gross_amount - discount_amount.
